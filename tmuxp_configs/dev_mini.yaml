session_name: Earth Rovers ROS2 Container
windows:
  - window_name: Earth Rovers Core Nodes
    layout: tiled
    shell_command_before:
      - bash
      - cd /earthrovers_ws
      - source /opt/ros/humble/setup.bash
      - source install/local_setup.bash
    panes:
    - shell_command:
      - ros2 launch earthrovers_bringup rover_tf_launch.py
    - shell_command:
      - ros2 run earthrovers_base base --ros-args --log-level debug -p earthrover_sdk_url:=http://localhost:8000 -p max_speed_ms:=1.0 -p max_angular_speed_rads:=1.0 -p robot_type:=mini
    - shell_command:
      - ros2 run earthrovers_navigation nav
    - shell_command:
      - ros2 run earthrovers_navigation waypoint_receiver --ros-args -p earthrover_sdk_url:=http://localhost:8000 -p checkpoint_reached_source:=distance
    - shell_command:
      - ros2 run earthrovers_vision cameras --ros-args -p earthrover_sdk_url:=http://localhost:8000 -p publish_rear_frame:=false -p publish_map_frame:=false
    - shell_command:
      - ros2 run teleop_twist_keyboard teleop_twist_keyboard
    - shell_command:
      - ros2 launch foxglove_bridge foxglove_bridge_launch.xml port:=8765
    - shell_command:
      - ros2 run earthrovers_state_estimation yaw_estimator_node
  - window_name: Controller
    layout: tiled
    shell_command_before:
      - bash
      - cd /earthrovers_ws
      - source /opt/ros/humble/setup.bash
      - source install/local_setup.bash
    panes:
    - shell_command:
      - ros2 run joy joy_node --ros-args -p device_id:=0
    - shell_command:
      - ros2 launch teleop_twist_joy teleop-launch.py joy_config:='ps3'
options:
  mouse: on  # Enable mouse mode